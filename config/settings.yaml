gpu:
  device: "cuda:0"
  batch_size_embed: 32
  batch_size_rerank: 16
  # Set to "http://localhost:8000" when the SSH tunnel is active (laptop mode).
  # Leave empty when running directly on the cluster.
  remote_url: ""

models:
  embedding: "BAAI/bge-m3"
  reranker: "BAAI/bge-reranker-v2-m3"

saia:
  # api_key is read from the SAIA_API_KEY env var — never set it here
  base_url: "https://chat-ai.academiccloud.de/v1"
  model: "qwen3.8-27b"
  temperature: 0
  max_tokens: 2048
  # headroom for longer multi-step query rewrites (thinking is disabled in the rewriter)
  rewriter_max_tokens: 300
  # SAIA allows 30 req/min — 3s spacing keeps a 95-query run at ~20 req/min
  request_interval_seconds: 3
  # Cap a hung SAIA call (shared-backend queueing) at 240 s instead of the
  # OpenAI client's 600 s default so a stalled request fails fast + retries
  timeout_seconds: 240
  # Client-side daily cap for the SAIA limiter. SAIA's REAL daily limit is 400
  # (confirmed via 429s 2026-10-27; NOT 1000). The client window counts EVERY
  # acquire() — including 429 retries AND the per-retrieval proxy permit (the rewriter
  # runs in the MCP server subprocess) — so it inflates above the number of *accepted*
  # SAIA calls. We set 450 (not a tight margin under 400) so a full day of answers fits
  # despite that inflation, while the 429-retry rate keeps actual accepted calls
  # (~275-340) safely under SAIA's 400.
  rate_limit_per_minute: 28
  rate_limit_per_hour: 180
  rate_limit_per_day: 450

retrieval:
  chunk_size_tokens: 512
  chunk_overlap_tokens: 64
  hybrid_top_k: 20
  rerank_top_n: 5
  rrf_k: 60

qdrant:
  host: "localhost"
  port: 6333
  collection_name: "thesis_corpus"
  dense_vector_size: 1024
  dense_vector_name: "dense"
  sparse_vector_name: "sparse"

data:
  documents_dir: "data/documents"
  queries_path: "data/queries/queries.json"
  results_dir: "data/results/retrieval"

evaluation:
  system_a_results_dir: "data/results/system_a"
  answers_filename: "answers.jsonl"
  ragas_scores_filename: "ragas_scores.json"
  evaluation_final_filename: "evaluation_final.json"
  runs_per_query: 3
  generation_pace_seconds: 10
  generator_retry_attempts: 5
  generator_retry_wait_seconds: 30
  generator_min_answer_chars: 15
  ragas_pace_seconds: 3
  ragas_min_interval_seconds: 11
  ragas_retry_attempts: 3
  ragas_retry_base_seconds: 10
  ragas_strictness: 3
  ragas_timeout_seconds: 300
  ragas_max_tokens: 4096

system_b:
  results_dir: "data/results/system_b"
  answers_filename: "answers.jsonl"
  ragas_scores_filename: "ragas_scores.json"
  evaluation_final_filename: "evaluation_final.json"
  runs_per_query: 3
  max_retrieval_calls: 3
  max_final_chunks: 5
  agent_max_tokens: 800
  agent_retry_attempts: 3
  agent_retry_base_seconds: 10
  mcp_retry_attempts: 3
  mcp_retry_wait_seconds: 2
  generation_pace_seconds: 10
  generator_retry_attempts: 5
  generator_retry_wait_seconds: 30
  generator_min_answer_chars: 15
  max_saia_calls_per_session: 800
